name: pqc-hsm-lab

services:
  pqc-hsm-lab:
    build: .
    image: pqc-hsm-lab:local
    hostname: pqc-hsm-lab
    # Run as the host user so files written to ./out are owned by you, not root.
    user: "${LAB_UID:-1000}:${LAB_GID:-1000}"
    environment:
      HOME: /tmp
    volumes:
      - ./:/lab
    working_dir: /lab

  # Only used by scripts/bench.sh (OpenSSL 3.5 speed baseline). Not built by a plain `docker compose build`.
  baseline:
    profiles: [baseline]
    build:
      context: .
      dockerfile: Dockerfile.baseline
    image: pqc-hsm-lab-baseline:local
    hostname: pqc-hsm-lab-baseline
    user: "${LAB_UID:-1000}:${LAB_GID:-1000}"
